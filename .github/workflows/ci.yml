name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.artifact_os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35) instead of ubuntu-latest (24.04, glibc
          # 2.39): the release binary must load on older Linux hosts (e.g.
          # WSL2 Ubuntu 22.04). ubuntu-latest-built mongo binaries require
          # GLIBC_2.38/2.39 and crash at describe on glibc < 2.38 systems.
          - { os: ubuntu-22.04, artifact_os: linux-x64,   bin: mpe_mongo_plugin }
          - { os: windows-latest, artifact_os: windows-x64, bin: mpe_mongo_plugin.exe }
          - { os: macos-latest, artifact_os: macos-x64,     bin: mpe_mongo_plugin }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compute version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Inject version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          python3 - "${{ steps.version.outputs.value }}" <<'EOF'
          import re, sys
          version = sys.argv[1]
          cargo = open("Cargo.toml", encoding="utf-8").read()
          cargo = re.sub(r'^version = "[^"]*"', f'version = "{version}"', cargo, count=1, flags=re.M)
          open("Cargo.toml", "w", encoding="utf-8").write(cargo)
          manifest = open("plugin.json", encoding="utf-8").read()
          manifest = re.sub(r'"version": "[^"]*"', f'"version": "{version}"', manifest, count=1)
          open("plugin.json", "w", encoding="utf-8").write(manifest)
          EOF
      - name: Build (release)
        run: cargo build --release
      - name: Offline tests (unit + stdio roundtrip)
        run: cargo test
      - name: Package zip + sha256
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.value }}
          mkdir -p dist/mongo
          cp plugin.json dist/mongo/
          cp target/release/${{ matrix.bin }} dist/mongo/
          python3 - "$VERSION" "${{ matrix.artifact_os }}" "${{ matrix.bin }}" <<'EOF'
          import hashlib, os, sys, zipfile
          version, artifact_os, bin = sys.argv[1], sys.argv[2], sys.argv[3]
          os.chmod(f"dist/mongo/{bin}", 0o755)
          name = f"mongo-{version}-{artifact_os}.zip"
          with zipfile.ZipFile(name, "w", zipfile.ZIP_DEFLATED) as z:
              for f in ("plugin.json", bin):
                  z.write(f"dist/mongo/{f}", f"mongo/{f}")
          digest = hashlib.sha256(open(name, "rb").read()).hexdigest()
          open(f"{name}.sha256", "w").write(f"{digest}  {name}\n")
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ matrix.artifact_os }}
          path: |
            mongo-*.zip
            mongo-*.zip.sha256

  integration:
    name: integration (real MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Integration tests
        env:
          MPE_MONGO_URI: mongodb://127.0.0.1:27017
        run: cargo test --test integration -- --include-ignored

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.2
        with:
          files: dist/*
      - name: Trigger registry sync
        if: env.GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.MPE_REGISTRY_TOKEN }}
        run: gh workflow run sync.yml --repo multi-protocol-flow/mpe-plugin-registry --ref main
